server {
    listen 8100;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # IP:端口访问时保持 API 同源；动态解析可适应后端容器重建。
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_upstream sudothink-backend:8000;
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Replace, do not append, the client chain received from an edge.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 根入口供搜索引擎抓取；管理域不公开站点索引。
    location = /robots.txt {
        default_type text/plain;
        if ($host = admin.feiwenchao.com) { return 200 "User-agent: *\nDisallow: /\n"; }
        set $seo_backend sudothink-backend:8000;
        proxy_pass http://$seo_backend/api/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        if ($host = admin.feiwenchao.com) { return 404; }
        set $seo_backend sudothink-backend:8000;
        proxy_pass http://$seo_backend/api/seo/sitemap.xml$is_args$args;
        proxy_set_header Host $host;
    }

    # 固定文件名的静态资源每次访问都重新校验。
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        if ($host = admin.feiwenchao.com) { add_header X-Robots-Tag "noindex, nofollow" always; }
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
