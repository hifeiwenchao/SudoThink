<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // 在页面绘制前应用偏好，避免深色模式刷新时闪白。
      ;(() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('sudothink-theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      html { background: #f5f7fa; }
      html.dark { background: #101214; }
    </style>
    <title>SudoThink 博客</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
