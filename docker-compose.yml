name: sudothink

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudothink-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    expose:
      - "8000"
    networks:
      - main
      - proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sudothink-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy

networks:
  main:
    external: true
    name: ${DEPENDS_MAIN_NETWORK:-depends_main}
  proxy:
    external: true
    name: ${DEPENDS_PROXY_NETWORK:-depends_proxy}
