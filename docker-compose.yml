name: sudothink

services:
  backend:
    image: sudothink-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    container_name: sudothink-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      QQWRY_DB_PATH: ${QQWRY_DB_PATH:-data/qqwry.dat}
    # The repository provides a default QQWry database, mounted read-only.
    # A missing or incompatible replacement falls back to an unknown location.
    volumes:
      - ${QQWRY_DATA_DIR:-./backend/data}:/app/data:ro
    expose:
      - "8000"
    networks:
      - main
      - proxy

  worker:
    image: sudothink-backend
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    networks:
      - main

  beat:
    image: sudothink-backend
    command: celery -A app.celery_app:celery_app beat --loglevel=INFO --schedule=/var/lib/celery/celerybeat-schedule
    container_name: sudothink-celery-beat
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - celerybeat-state:/var/lib/celery
    networks:
      - main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        CDN_BASE_URL: ${CDN_BASE_URL:-}
        OSS_STATIC_PREFIX: ${OSS_STATIC_PREFIX-static}
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    container_name: sudothink-frontend
    restart: unless-stopped
    expose:
      - "8100"
    ports:
      - "${FRONTEND_HTTP_PORT:-8100}:8100"
    networks:
      - proxy

networks:
  main:
    external: true
    name: ${DEPENDS_MAIN_NETWORK:-depends_main}
  proxy:
    external: true
    name: ${DEPENDS_PROXY_NETWORK:-depends_proxy}

volumes:
  celerybeat-state:
