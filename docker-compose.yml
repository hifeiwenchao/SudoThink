name: sudothink

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    container_name: sudothink-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    expose:
      - "8000"
    networks:
      - main
      - proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-}
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    container_name: sudothink-frontend
    restart: unless-stopped
    expose:
      - "8100"
    ports:
      - "${FRONTEND_HTTP_PORT:-8100}:8100"
    networks:
      - proxy

networks:
  main:
    external: true
    name: ${DEPENDS_MAIN_NETWORK:-depends_main}
  proxy:
    external: true
    name: ${DEPENDS_PROXY_NETWORK:-depends_proxy}
