upstream sudothink_backend {
    server sudothink-backend:8000;
}

upstream sudothink_frontend {
    server sudothink-frontend:8100;
}

server {
    listen 80;
    server_name www.feiwenchao.com admin.feiwenchao.com;

    # 保留原域名、路径、查询参数及请求方法，统一使用 HTTPS。
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.feiwenchao.com admin.feiwenchao.com;

    # 证书需同时覆盖公开站点和管理站点。
    ssl_certificate     /etc/ssl/depends/feiwenchao.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/depends/feiwenchao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SudoThinkSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # 后端 API；边缘代理覆盖来源头，防止客户端伪造 X-Forwarded-For 链。
    location /api/ {
        proxy_pass         http://sudothink_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 支持（可选保留）
    location /ws/ {
        proxy_pass         http://sudothink_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 前端静态资源（由 frontend 容器内的 NGINX 提供）
    location / {
        proxy_pass         http://sudothink_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name feiwenchao.com;

    # HTTPS 跳转前需要完成 TLS 握手，证书须覆盖裸域。
    ssl_certificate     /etc/ssl/depends/feiwenchao.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/depends/feiwenchao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 统一公开站点域名，保留路径、查询参数及请求方法。
    return 308 https://www.feiwenchao.com$request_uri;
}
